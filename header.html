<!-- ============================================================
     MODULE: header.html
     Deskripsi: Top navigation bar — logo, menu, user info
     Dipanggil oleh: index.html via ModuleLoader
     ============================================================ -->

<header class="app-header">
  <!-- Logo -->
  <div class="header-logo">
    <div class="logo-mark">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
        <rect x="2" y="2" width="9" height="9" rx="2" fill="currentColor"/>
        <rect x="13" y="2" width="9" height="9" rx="2" fill="currentColor" opacity=".5"/>
        <rect x="2" y="13" width="9" height="9" rx="2" fill="currentColor" opacity=".5"/>
        <rect x="13" y="13" width="9" height="9" rx="2" fill="currentColor"/>
      </svg>
    </div>
    <span class="logo-text">AdminPanel</span>
  </div>

  <!-- Search -->
  <div class="header-search">
    <svg class="search-ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
    </svg>
    <input type="text" placeholder="Cari sesuatu..." id="globalSearch" />
  </div>

  <!-- Right actions -->
  <div class="header-right">
    <button class="icon-btn" id="toggleDark" title="Toggle tema">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
    </button>

    <button class="icon-btn notif-btn" title="Notifikasi">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>
      </svg>
      <span class="notif-dot"></span>
    </button>

    <div class="user-chip">
      <div class="user-avatar">BK</div>
      <div class="user-meta">
        <span class="user-name">Budi K.</span>
        <span class="user-role">Administrator</span>
      </div>
    </div>
  </div>
</header>

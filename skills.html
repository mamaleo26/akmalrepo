<div class="glass-card">

            </div>
        </div>

        <div style="background: rgba(255,255,255,0.03); padding: 20px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.05);">

                <span>PHP & MySQL (Backend)</span>

            </div>
            <div style="height: 6px; background: rgba(255,255,255,0.1); border-radius: 10px;">

            </div>
        </div>

        <div style="background: rgba(255,255,255,0.03); padding: 20px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.05);">

                <span>JavaScript & jQuery</span>
                <span style="color: #6366f1;">80%</span>
            </div>
            <div style="height: 6px; background: rgba(255,255,255,0.1); border-radius: 10px;">
                <div class="skill-progress" data-level="80" style="height: 100%; width: 0%; background: #6366f1; border-radius: 10px; transition: 1.5s ease-in-out;"></div>
            </div>
        </div>

        <div style="background: rgba(255,255,255,0.03); padding: 20px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.05);">

            <div style="height: 6px; background: rgba(255,255,255,0.1); border-radius: 10px;">
                <div class="skill-progress" data-level="75" style="height: 100%; width: 0%; background: #6366f1; border-radius: 10px; transition: 1.5s ease-in-out;"></div>
            </div>
        </div>
